[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stanag4607"
version = "0.1.0"
description = "Pure-Python STANAG 4607 GMTI protocol toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stanag4607 contributors" }]
keywords = ["stanag4607", "stanag-4607", "gmti", "radar", "geospatial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/trane293/stanag4607"
Documentation = "https://stanag4607.readthedocs.io/"
Repository = "https://github.com/trane293/stanag4607"
Issues = "https://github.com/trane293/stanag4607/issues"
Changelog = "https://github.com/trane293/stanag4607/blob/main/CHANGELOG.md"

[project.scripts]
stanag4607 = "stanag4607.cli:entrypoint"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
  "mkdocstrings[python]>=1.0,<2",
]
test = [
  "hypothesis>=6.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
]
dev = [
  "stanag4607[test]",
  "build>=1.2",
  "mypy>=1.11",
  "ruff>=0.6",
  "twine>=5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stanag4607"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/examples",
  "/references/data/manifest.json",
  "/references/standards/manifest.json",
  "/src",
  "/tests",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/LICENSES/Apache-2.0.txt",
  "/.readthedocs.yaml",
  "/mkdocs.yml",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stanag4607"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Keep every protocol increment fully typed from its first failing test.
[tool.mypy]
python_version = "3.10"
strict = true
packages = ["stanag4607"]
